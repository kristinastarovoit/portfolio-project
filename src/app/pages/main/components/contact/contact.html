<section class="contact">
    <div class="contact__text-content">
        <div>
            <h2 class="text-white">{{'app.contact.heading' | translate}}</h2>
            <h3 class="text-white contact__h3">{{'app.contact.heading-two' | translate}}</h3>
        </div>
        <p class="text-white">{{'app.contact.text' | translate}}
        </p>
        <img class="contact__arrow" src="/sticker/contact_line.png">
    </div>
    <div class="contact__form-content">
        <img src="/sticker/sticker_round.png">
        <form [formGroup]="contactForm" (ngSubmit)="submitForm()">

            <div class="contact__input-wrapper">
                <label class="text-white contact__label" for="name">{{'app.contact.namelabel' | translate}}</label>
                <input id="name" type="text" formControlName="name">
            </div>
            <div class="contact__input-wrapper">
                <label class="text-white contact__label" for="mail">{{'app.contact.maillabel' | translate}}</label>
                <input id="mail" type="email" formControlName="email">
            </div>
            <div class="contact__input-wrapper">
                <label class="text-white contact__label" for="message">{{'app.contact.messagelabel' | translate}}</label>
                <input id="message" type="text" formControlName="message">
            </div>
            <p class="contact__accept-text text-white">DSVG gelesen</p>
            <input type="checkbox"><p>{{'app.contact.checkboxtext' | translate}}<a routerLink="privacypolicy">{{'app.privacy-policy.title' | translate}}</a> {{'app.contact.checkboxtext-two' | translate}}</p>
            <button class="btn btn--white" type="submit" (click)="submitForm()" [disabled]="!contactForm.value">Send</button>
        </form>

    </div>
</section>
